# Site settings
title: 我的博客
description: 分享技术、生活和思考
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. https://example.com
source_repository: jiaaozhe/jiaaozhe.github.io
raw_branch: main

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Theme settings (optional)
# theme: minima

# Collections
collections:
  posts:
    output: true
    permalink: /posts/:title/
  publications:
    output: true
    permalink: /publications/:title/
  uses:
    output: true
    permalink: /uses/:title/
  fragments:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "uses"
    values:
      layout: "use"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md
  - DESIGN.md
  - AGENTS.md
