<!DOCTYPE html>
<html lang="zh-CN" data-site-baseurl="{{ site.baseurl }}" data-site-version="{{ site.time | date: '%s' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ '/assets/css/cat-bot.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% seo %}
</head>
<body>
    {% include site-header.html %}

    <main class="site-main">
        {{ content }}
    </main>

    {% include site-footer.html %}
    {% include command-palette.html %}

    {% if page.collection == 'publications' or page.url == '/research/' %}
    {% include bibtex-modal.html %}
    {% endif %}

    {% include cat-bot.html %}
    {% include site-scripts.html %}
</body>
</html>
