    <text x="407" y="348" fill="#7a8798" font-family="ui-monospace,monospace" font-size="9">本地文本</text>
  </g>

  <g transform="translate(606 159)">
    <rect width="570" height="359" fill="#ffffff" stroke="#d9dfe7"/>
    <rect width="570" height="52" fill="#f7f9fc"/>
    <line x1="0" y1="52" x2="570" y2="52" stroke="#dde3eb"/>
