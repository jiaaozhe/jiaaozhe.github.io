<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Markdown 编辑器界面预览</title>
  <desc id="desc">统一工作台风格的双栏 Markdown 编辑器，左侧编辑，右侧实时预览。</desc>
  <rect width="1200" height="675" fill="#f3f6f9"/>

  <rect width="1200" height="52" fill="#ffffff"/>
  <path d="M0 51.5H1200" stroke="#d8e1e9"/>
  <rect x="16" y="9" width="226" height="34" rx="6" fill="#f8fafc" stroke="#d8e1e9"/>
  <text x="30" y="31" fill="#19232d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">产品设计记录.md</text>
  <rect x="830" y="9" width="74" height="34" rx="5" fill="#3f6f9f"/>
  <path d="M847 18v15h12V21l-3-3zM850 18v5h6v-5M850 28h6v5h-6z" fill="none" stroke="#fff" stroke-width="1.3"/>
  <text x="866" y="31" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="600">保存</text>
  <g fill="#667482" font-family="system-ui,sans-serif" font-size="11">
    <text x="925" y="31">导入</text>
    <text x="977" y="31">导出</text>
    <text x="1029" y="31">网页转 MD</text>
    <text x="1110" y="31">帮助</text>
    <text x="1155" y="31">语言</text>
  </g>

  <rect y="52" width="1200" height="44" fill="#f8fafc"/>
  <path d="M0 95.5H1200" stroke="#d8e1e9"/>
  <g transform="translate(12 58)">
    <g fill="#ffffff" stroke="#d8e1e9">
      <rect width="32" height="32" rx="4"/>
      <rect x="34" width="32" height="32" rx="4"/>
      <rect x="76" width="32" height="32" rx="4"/>
      <rect x="110" width="32" height="32" rx="4"/>
      <rect x="144" width="32" height="32" rx="4"/>
      <rect x="186" width="50" height="32" rx="4"/>
      <rect x="246" width="58" height="32" rx="4"/>
      <rect x="306" width="58" height="32" rx="4"/>
      <rect x="366" width="58" height="32" rx="4"/>
      <rect x="434" width="62" height="32" rx="4"/>
      <rect x="498" width="62" height="32" rx="4"/>
      <rect x="562" width="62" height="32" rx="4"/>
      <rect x="634" width="62" height="32" rx="4"/>
    </g>
    <g fill="#667482" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
      <text x="16" y="21">↶</text>
      <text x="50" y="21">↷</text>
      <text x="92" y="21" font-weight="700">B</text>
      <text x="126" y="21" font-style="italic">I</text>
      <text x="160" y="21">H</text>
      <text x="211" y="21">引用</text>
      <text x="275" y="21">列表</text>
      <text x="335" y="21">任务</text>
      <text x="395" y="21">代码</text>
      <text x="465" y="21">链接</text>
      <text x="529" y="21">图片</text>
      <text x="593" y="21">表格</text>
      <text x="665" y="21">查找</text>
    </g>
  </g>

  <rect y="96" width="600" height="42" fill="#f8fafc"/>
  <rect x="606" y="96" width="594" height="42" fill="#f8fafc"/>
  <path d="M0 138H1200M603 96V646" stroke="#d8e1e9"/>
  <text x="18" y="122" fill="#19232d" font-family="system-ui,sans-serif" font-size="12" font-weight="600">编辑</text>
  <text x="630" y="122" fill="#19232d" font-family="system-ui,sans-serif" font-size="12" font-weight="600">实时预览</text>
  <rect x="1045" y="103" width="116" height="28" rx="6" fill="#f3f6f9" stroke="#d8e1e9"/>
  <rect x="1048" y="106" width="54" height="22" rx="4" fill="#ffffff"/>
  <text x="1064" y="121" fill="#19232d" font-family="system-ui,sans-serif" font-size="10">预览</text>
  <text x="1121" y="121" fill="#667482" font-family="system-ui,sans-serif" font-size="10">源码</text>

  <rect y="138" width="600" height="508" fill="#ffffff"/>
  <rect x="606" y="138" width="594" height="508" fill="#ffffff"/>

  <g transform="translate(32 171)" font-family="ui-monospace,monospace">
    <text fill="#3f6f9f" font-size="17" font-weight="700"># 产品设计记录</text>
    <text y="40" fill="#667482" font-size="13">记录工具界面的统一原则与实施进度。</text>
    <text y="88" fill="#3f6f9f" font-size="15" font-weight="700">## 设计原则</text>
    <g fill="#19232d" font-size="13">
      <text y="124">- 中性纸面与单一强调色</text>
      <text y="154">- 清晰的操作层级</text>
      <text y="184">- 完整的键盘与状态反馈</text>
    </g>
    <text y="232" fill="#3f6f9f" font-size="15" font-weight="700">## 组件规格</text>
    <rect y="251" width="516" height="120" rx="7" fill="#18212a"/>
    <g fill="#dce5ed" font-size="12">
      <text x="18" y="280">toolbar: 52px</text>
      <text x="18" y="306">control: 34px</text>
      <text x="18" y="332">accent: #3f6f9f</text>
      <text x="18" y="358">radius: 4px / 6px / 8px</text>
    </g>
    <text y="418" fill="#667482" font-size="13">&gt; 所有内容仅保存在当前浏览器。</text>
  </g>

  <g transform="translate(674 174)" font-family="system-ui,sans-serif">
    <text fill="#101820" font-size="31" font-weight="700" letter-spacing="-1">产品设计记录</text>
    <text y="46" fill="#667482" font-size="14">记录工具界面的统一原则与实施进度。</text>
    <text y="104" fill="#101820" font-size="22" font-weight="650">设计原则</text>
    <g fill="#19232d" font-size="14">
      <circle cx="5" cy="138" r="2.5" fill="#3f6f9f"/><text x="18" y="143">中性纸面与单一强调色</text>
      <circle cx="5" cy="170" r="2.5" fill="#3f6f9f"/><text x="18" y="175">清晰的操作层级</text>
      <circle cx="5" cy="202" r="2.5" fill="#3f6f9f"/><text x="18" y="207">完整的键盘与状态反馈</text>
    </g>
    <text y="266" fill="#101820" font-size="22" font-weight="650">组件规格</text>
    <rect y="288" width="454" height="112" rx="8" fill="#18212a" stroke="#354657"/>
    <g fill="#dce5ed" font-family="ui-monospace,monospace" font-size="13">
      <text x="18" y="318">toolbar: 52px</text>
      <text x="18" y="344">control: 34px</text>
      <text x="18" y="370">accent: #3f6f9f</text>
      <text x="18" y="396">radius: 4px / 6px / 8px</text>
    </g>
    <path d="M0 438V510" stroke="#3f6f9f" stroke-width="3"/>
    <text x="18" y="462" fill="#667482" font-size="14" font-style="italic">所有内容仅保存在当前浏览器。</text>
  </g>

  <rect y="646" width="1200" height="29" fill="#f8fafc"/>
  <path d="M0 646H1200" stroke="#d8e1e9"/>
  <text x="14" y="665" fill="#667482" font-family="ui-monospace,monospace" font-size="9">自动保存已启用</text>
  <text x="1040" y="665" fill="#667482" font-family="ui-monospace,monospace" font-size="9">1,284 字 · Markdown</text>
</svg>
