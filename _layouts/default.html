<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    {% seo %}
</head>
<body>
    <header>
        <nav>
            <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
            <ul>
                <li><a href="{{ '/' | relative_url }}">个人介绍</a></li>
                <li><a href="{{ '/posts' | relative_url }}">博客</a></li>
                <li><a href="{{ '/categories' | relative_url }}">分类</a></li>
                <li><a href="{{ '/about' | relative_url }}">关于</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. 使用 GitHub Pages 搭建.</p>
    </footer>
</body>
</html>
