<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% seo %}
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="主导航">
            <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首页">
                <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
                    <circle cx="32" cy="32" r="23"></circle>
                    <path d="M23 18v20c0 8 7 13 15 8l12-8-17-9 15-10"></path>
                    <circle cx="23" cy="18" r="3"></circle>
                    <circle cx="38" cy="46" r="3"></circle>
                    <circle cx="50" cy="38" r="3"></circle>
                    <circle cx="48" cy="19" r="3"></circle>
                </svg>
                <span>{{ site.title }}</span>
            </a>

            <button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="site-menu">
                <span></span>
                <span></span>
            </button>

            <ul id="site-menu" class="nav-menu">
                <li><a href="{{ '/' | relative_url }}">首页</a></li>
                <li><a href="{{ '/research/' | relative_url }}">学术研究</a></li>
                <li><a href="{{ '/posts/' | relative_url }}">文章</a></li>
                <li><a href="{{ '/introduction/' | relative_url }}">关于</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Built with GitHub Pages.</p>
    </footer>

    <div id="command-palette" class="command-palette" aria-hidden="true">
        <div class="command-panel" role="dialog" aria-modal="true" aria-labelledby="command-title">
            <div class="command-title" id="command-title">jiaaozhe.site</div>
            <div class="command-output" id="command-output" aria-live="polite">
                <p>type "help"</p>
            </div>
            <form class="command-form" id="command-form">
                <label for="command-input">&gt;</label>
                <input id="command-input" class="command-input" type="text" autocomplete="off" spellcheck="false">
            </form>
        </div>
    </div>

    <!-- BibTeX Modal -->
    <div id="bibtex-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>BibTeX 引用</h3>
                <button class="close-btn" type="button" aria-label="关闭 BibTeX">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="bibtex-content"></pre>
            </div>
            <div class="modal-footer">
                <button id="copy-bibtex" class="copy-btn">复制到剪贴板</button>
            </div>
        </div>
    </div>

    <script type="application/json" id="site-posts-data">
        [
            {% for post in site.posts %}
            {
                "title": {{ post.title | jsonify }},
                "url": {{ post.url | relative_url | jsonify }}
            }{% unless forloop.last %},{% endunless %}
            {% endfor %}
        ]
    </script>
    <script src="{{ '/assets/js/script.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
