    </g>
    <g font-family="ui-monospace,monospace" font-size="12">
      <text x="59" y="82" fill="#263142">{</text>
      <text x="76" y="103" fill="#4d70b8">"service"</text><text x="145" y="103" fill="#263142">: </text><text x="158" y="103" fill="#2f7d61">"photo-api"</text><text x="229" y="103" fill="#263142">,</text>
      <text x="76" y="124" fill="#4d70b8">"enabled"</text><text x="139" y="124" fill="#263142">: </text><text x="152" y="124" fill="#9a652d">true</text><text x="181" y="124" fill="#263142">,</text>
      <text x="76" y="145" fill="#4d70b8">"retry"</text><text x="126" y="145" fill="#263142">: {</text>
      <text x="94" y="166" fill="#4d70b8">"attempts"</text><text x="166" y="166" fill="#263142">: </text><text x="179" y="166" fill="#9a652d">3</text><text x="188" y="166" fill="#263142">,</text>
      <text x="94" y="187" fill="#4d70b8">"backoff"</text><text x="159" y="187" fill="#263142">: </text><text x="172" y="187" fill="#9a652d">1.5</text>
      <text x="76" y="208" fill="#263142">},</text>
      <text x="76" y="229" fill="#4d70b8">"regions"</text><text x="139" y="229" fill="#263142">: [</text><text x="151" y="229" fill="#2f7d61">"cn-east", "eu-west"</text><text x="291" y="229" fill="#263142">]</text>
      <text x="59" y="250" fill="#263142">}</text>
    </g>
