<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    {% seo %}
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="主导航">
            <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首页">
                <span class="brand-mark" aria-hidden="true">J</span>
                <span>{{ site.title }}</span>
            </a>

            <button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="site-menu">
                <span></span>
                <span></span>
            </button>

            <ul id="site-menu" class="nav-menu">
                <li><a href="{{ '/' | relative_url }}">首页</a></li>
                <li><a href="{{ '/research/' | relative_url }}">学术研究</a></li>
                <li><a href="{{ '/posts/' | relative_url }}">文章</a></li>
                <li><a href="{{ '/introduction/' | relative_url }}">关于</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Built with GitHub Pages.</p>
    </footer>

    <!-- BibTeX Modal -->
    <div id="bibtex-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>BibTeX 引用</h3>
                <button class="close-btn" type="button" aria-label="关闭 BibTeX">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="bibtex-content"></pre>
            </div>
            <div class="modal-footer">
                <button id="copy-bibtex" class="copy-btn">复制到剪贴板</button>
            </div>
        </div>
    </div>

    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
</body>
</html>
