    <text x="501" y="30" fill="#6f7a8a" font-family="ui-monospace,monospace" font-size="9" font-weight="700">下载</text>
    <rect x="0" y="52" width="42" height="277" fill="#f3f5f8"/>
    <line x1="42" y1="52" x2="42" y2="329" stroke="#dde3eb"/>
    <g fill="#99a3b0" font-family="ui-monospace,monospace" font-size="11" text-anchor="end">
      <text x="31" y="82">1</text><text x="31" y="103">2</text><text x="31" y="124">3</text><text x="31" y="145">4</text><text x="31" y="166">5</text><text x="31" y="187">6</text>
    </g>
    <g font-family="ui-monospace,monospace" font-size="12">
      <text x="59" y="82" fill="#4d70b8">service:</text><text x="120" y="82" fill="#2f7d61"> photo-api</text>
      <text x="59" y="103" fill="#4d70b8">enabled:</text><text x="125" y="103" fill="#9a652d"> true</text>
      <text x="59" y="124" fill="#4d70b8">retry:</text>
      <text x="76" y="145" fill="#4d70b8">attempts:</text><text x="148" y="145" fill="#9a652d"> 3</text>
      <text x="76" y="166" fill="#4d70b8">backoff:</text><text x="141" y="166" fill="#9a652d"> 1.5</text>
      <text x="59" y="187" fill="#4d70b8">regions:</text><text x="124" y="187" fill="#263142"> [</text><text x="135" y="187" fill="#2f7d61">cn-east, eu-west</text><text x="252" y="187" fill="#263142">]</text>
    </g>
    <rect y="329" width="570" height="30" fill="#f3f5f8"/>
    <line x1="0" y1="329" x2="570" y2="329" stroke="#dde3eb"/>
    <text x="14" y="348" fill="#7a8798" font-family="ui-monospace,monospace" font-size="9">146 B · 8 行</text>
    <text x="422" y="348" fill="#2f7d61" font-family="ui-monospace,monospace" font-size="9">✓ 回读语义一致</text>
  </g>

  <g transform="translate(24 532)">
    <rect width="1152" height="119" fill="#ffffff" stroke="#d9dfe7"/>
    <line x1="585" y1="0" x2="585" y2="119" stroke="#d9dfe7"/>
    <line x1="862" y1="0" x2="862" y2="119" stroke="#d9dfe7"/>
    <rect x="13" y="13" width="21" height="21" fill="#edf2fa"/>
