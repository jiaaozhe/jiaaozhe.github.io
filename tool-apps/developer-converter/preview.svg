    <text x="504" y="27" fill="#2f7d61" font-family="ui-monospace,monospace" font-size="9" font-weight="700">可导出</text>
    <rect x="14" y="50" width="550" height="45" fill="#f7f9fc" stroke="#d9dfe7"/>
    <circle cx="31" cy="72" r="4" fill="#2f7d61"/>
    <text x="44" y="76" fill="#253041" font-family="system-ui,sans-serif" font-size="11">目标格式回读后语义一致。</text>
    <rect x="599" y="13" width="21" height="21" fill="#edf2fa"/>
    <text x="606" y="28" fill="#36578f" font-family="ui-monospace,monospace" font-size="9">B</text>
    <text x="630" y="28" fill="#253041" font-family="system-ui,sans-serif" font-size="12" font-weight="700">转换轨迹</text>
    <text x="601" y="61" fill="#6f7a8a" font-family="ui-monospace,monospace" font-size="9">识别</text>
    <text x="664" y="61" fill="#253041" font-family="system-ui,sans-serif" font-size="11" font-weight="700">JSON · HIGH</text>
    <text x="601" y="83" fill="#6f7a8a" font-family="ui-monospace,monospace" font-size="9">回读</text>
    <text x="664" y="83" fill="#2f7d61" font-family="system-ui,sans-serif" font-size="11" font-weight="700">PASS · 语义一致</text>
    <rect x="876" y="13" width="21" height="21" fill="#edf2fa"/>
    <text x="883" y="28" fill="#36578f" font-family="ui-monospace,monospace" font-size="9">C</text>
    <text x="907" y="28" fill="#253041" font-family="system-ui,sans-serif" font-size="12" font-weight="700">输出规则</text>
    <text x="878" y="63" fill="#6f7a8a" font-family="system-ui,sans-serif" font-size="10">缩进</text>
    <text x="1108" y="63" fill="#253041" font-family="ui-monospace,monospace" font-size="10">2 空格</text>
    <text x="878" y="87" fill="#6f7a8a" font-family="system-ui,sans-serif" font-size="10">递归排序键</text>
    <rect x="1127" y="77" width="28" height="15" fill="#e7ebf0" stroke="#b8c1cd"/>
