name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Validate generated site
        run: bundle exec ruby scripts/validate_site.rb

      - name: Smoke test site AI
        run: node scripts/smoke_site_ai.js

      - name: Smoke test sandbox tool runtime
        run: node scripts/smoke_tool_runtime.js

      - name: Smoke test image workbench
        run: node scripts/smoke_image_workbench.js

      - name: Smoke test PDF page manager
        run: node scripts/smoke_pdf_page_manager.js

      - name: Smoke test QR workbench
        run: node scripts/smoke_qr_workbench.js

      - name: Smoke test developer converter
        run: node scripts/smoke_developer_converter.js

      - name: Smoke test text diff
        run: node scripts/smoke_text_diff.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
