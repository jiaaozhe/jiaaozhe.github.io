name: Deploy Site With Fresh Stocks

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * *'  # UTC 12:00 = Beijing 20:00
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: .github/workflows/update-stocks.yml

      - name: Fetch stock data
        run: uv run --with yfinance --with pyyaml python scripts/update_stocks.py

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Validate generated site
        run: bundle exec ruby scripts/validate_site.rb

      - name: Smoke test site AI
        run: node scripts/smoke_site_ai.js

      - name: Smoke test sandbox tool runtime
        run: node scripts/smoke_tool_runtime.js

      - name: Smoke test image workbench
        run: node scripts/smoke_image_workbench.js

      - name: Smoke test PDF page manager
        run: node scripts/smoke_pdf_page_manager.js

      - name: Smoke test QR workbench
        run: node scripts/smoke_qr_workbench.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
