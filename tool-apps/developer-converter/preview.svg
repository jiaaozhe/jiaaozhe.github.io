<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">开发者转换台预览</title>
  <desc id="desc">双栏代码转换界面，展示 JSON 到 YAML 与 cURL 到 Python 两种工作模式。</desc>
  <rect width="1200" height="675" fill="#f1f3f6"/>
  <rect width="1200" height="62" fill="#ffffff"/>
  <line x1="0" y1="61.5" x2="1200" y2="61.5" stroke="#d9dfe7"/>
  <g fill="#4d70b8">
    <rect x="29" y="21" width="18" height="4"/>
    <rect x="29" y="29" width="28" height="4"/>
    <rect x="29" y="37" width="12" height="4"/>
  </g>
  <text x="72" y="37" fill="#253041" font-family="ui-monospace,monospace" font-size="15" font-weight="700" letter-spacing="1.5">DEV / TRANSFORM</text>
  <rect x="256" width="172" height="62" fill="#edf2fa"/>
  <rect x="256" y="58" width="172" height="4" fill="#4d70b8"/>
  <text x="283" y="37" fill="#253041" font-family="system-ui,sans-serif" font-size="15" font-weight="700">01　配置互转</text>
  <text x="468" y="37" fill="#6f7a8a" font-family="system-ui,sans-serif" font-size="15" font-weight="700">02　cURL → Python</text>
  <circle cx="1064" cy="31" r="6" fill="none" stroke="#2f7d61" stroke-width="3"/>
  <text x="1080" y="35" fill="#6f7a8a" font-family="ui-monospace,monospace" font-size="11">LOCAL ONLY</text>

  <rect x="24" y="83" width="1152" height="60" fill="#ffffff" stroke="#d9dfe7"/>
  <text x="43" y="103" fill="#6f7a8a" font-family="ui-monospace,monospace" font-size="9" font-weight="700">输入</text>
  <rect x="43" y="109" width="105" height="27" fill="#ffffff" stroke="#b8c1cd"/>
  <text x="62" y="127" fill="#253041" font-family="ui-monospace,monospace" font-size="11" font-weight="700">AUTO</text>
  <rect x="157" y="109" width="31" height="27" fill="#f7f9fc" stroke="#b8c1cd"/>
  <path d="M164 117h17m0 0-4-4m4 4-4 4m5 7h-17m0 0 4 4m-4-4 4-4" fill="none" stroke="#36578f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="103" fill="#6f7a8a" font-family="ui-monospace,monospace" font-size="9" font-weight="700">输出</text>
  <rect x="200" y="109" width="105" height="27" fill="#ffffff" stroke="#b8c1cd"/>
  <text x="219" y="127" fill="#253041" font-family="ui-monospace,monospace" font-size="11" font-weight="700">YAML</text>
  <text x="326" y="103" fill="#6f7a8a" font-family="ui-monospace,monospace" font-size="9" font-weight="700">策略 · 有损时阻止</text>
  <rect x="326" y="109" width="145" height="27" fill="#edf0f4" stroke="#d9dfe7"/>
  <rect x="329" y="112" width="68" height="21" fill="#ffffff"/>
  <circle cx="343" cy="122.5" r="4" fill="#2f7d61"/>
  <text x="353" y="127" fill="#253041" font-family="system-ui,sans-serif" font-size="11" font-weight="700">保真</text>
  <text x="420" y="127" fill="#6f7a8a" font-family="system-ui,sans-serif" font-size="11" font-weight="700">宽松</text>
  <rect x="1027" y="96" width="132" height="34" fill="#4d70b8" stroke="#36578f"/>
  <text x="1053" y="118" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">执行转换　⌘↵</text>

  <g transform="translate(24 159)">
    <rect width="570" height="359" fill="#ffffff" stroke="#d9dfe7"/>
    <rect width="570" height="52" fill="#f7f9fc"/>
    <line x1="0" y1="52" x2="570" y2="52" stroke="#dde3eb"/>
