---
layout: default
---
<article class="post">
    <h2>{{ page.title }}</h2>
    <p class="post-date">{{ page.date | date: "%Y年%-m月%-d日" }}</p>
    
    {% if page.categories %}
    <div class="post-categories">
        分类: 
        {% for category in page.categories %}
        <a href="/categories/#{{ category | slugify }}">{{ category }}</a>{% unless forloop.last %}, {% endunless %}
        {% endfor %}
    </div>
    {% endif %}
    
    <div class="post-content">
        {{ content }}
    </div>
    
    <a href="{{ '/' | relative_url }}" class="back-link">← 返回首页</a>
</article>
